services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_fastapi_example
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: fastapi_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 80 --reload
    volumes:
      - .:/code
    ports:
      - "8000:80"
    environment:
      - DATABASE_URL=postgresql://postgresv:postgres@db:5432/db_fastapi_example
    depends_on:
      - db

volumes:
  postgres_data: